    <linearGradient id="side" x1="100" y1="200" x2="630" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#e14a3b"/><stop offset=".5" stop-color="#9b292b"/><stop offset="1" stop-color="#3c171c"/></linearGradient>
    <linearGradient id="slash" x1="330" y1="130" x2="420" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#fff5dd"/><stop offset=".38" stop-color="#d6d5bd"/><stop offset="1" stop-color="#706c61"/></linearGradient>
